---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Render Readme"

on:
  workflow_call:
    secrets:
      BOT_APP_ID:
        description: The App ID of the GitHub App
        required: true
      BOT_APP_PRIVATE_KEY:
        description: The private key of the GitHub App
        required: true

jobs:
  render-readme:
    name: Render README
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: "${{ steps.app-token.outputs.token }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip

      - name: Install Python Requirements
        shell: bash
        run: pip install --requirement requirements.txt && pip freeze

      - name: Render README
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
        shell: bash
        run: python ./scripts/render-readme.py

      - name: Commit Changes
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        shell: bash
        run: |
          git diff --quiet -- README.md && exit 0
          gh api graphql \
            -F repo="${GITHUB_REPOSITORY}" \
            -F branch="${GITHUB_REF_NAME}" \
            -F head="$(git rev-parse HEAD)" \
            -F contents="$(base64 -w0 README.md)" \
            -f query='
              mutation($repo: String!, $branch: String!, $head: GitObjectID!, $contents: Base64String!) {
                createCommitOnBranch(input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch }
                  message: { headline: "chore: render README.md" }
                  expectedHeadOid: $head
                  fileChanges: { additions: [{ path: "README.md", contents: $contents }] }
                }) { commit { oid } }
              }'
